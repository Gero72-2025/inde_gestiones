<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Referencia de correlativo en factura</title>
  <desc id="desc">Ejemplo de factura con el correlativo resaltado para orientar al usuario.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f7f9fc" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="326" rx="12" fill="url(#bg)" stroke="#d8dee9" stroke-width="2" />

  <text x="36" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">
    FACTURA DE ENERGIA ELECTRICA
  </text>
  <text x="36" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4b5563">
    Empresa Electrica de Guatemala, S.A.
  </text>

  <text x="36" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#111827">
    REF. PARA BANCOS
  </text>
  <text x="36" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#111827">
    No. 254210054
  </text>

  <rect x="505" y="110" width="190" height="130" rx="8" fill="#fff" stroke="#ef4444" stroke-width="6" />
  <text x="530" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="900" fill="#111827">CORRELATIVO</text>
  <text x="590" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="900" fill="#111827">469516</text>

  <path d="M470 175 L370 175" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
  <path d="M370 175 L390 160" stroke="#ef4444" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M370 175 L390 190" stroke="#ef4444" stroke-width="6" fill="none" stroke-linecap="round" />

  <rect x="60" y="246" width="560" height="52" rx="10" fill="#eff6ff" stroke="#93c5fd" />
  <text x="80" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">
    Busca este numero en tu recibo y copialo en el campo Correlativo (NIS)
  </text>
